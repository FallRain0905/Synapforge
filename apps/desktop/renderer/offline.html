<!doctype html>
<!-- 离线页（DESKTOP-GUI D-1）：工作台加载失败时显示，提供重试、改服务器地址、看内核状态。
     纯本地文件，无网络依赖。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>synapforge · 连不上平台</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #fafafa; color: #171717; font: 14px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
    .card { width: min(560px, 92vw); border: 1px solid #e5e5e5; border-radius: 14px; background: #fff; padding: 22px 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h1 { font-size: 17px; margin: 0 0 6px; }
    .hint { color: #525252; font-size: 12.5px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    button { background: #171717; color: #ededed; border: 0; border-radius: 9px; padding: 9px 16px; font: inherit; font-weight: 550; cursor: pointer; }
    button.secondary { background: #fff; color: #171717; border: 1px solid #d4d4d4; }
    .addr { margin-top: 12px; font-size: 12.5px; color: #525252; }
    code { background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 6px; padding: 1px 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>连不上平台工作台</h1>
    <div class="hint" id="detail">可能的原因：网络不可用、服务器地址写错、或平台正在维护。</div>
    <div class="addr">当前服务器地址：<code id="platform">—</code></div>
    <div class="row">
      <button id="retry">重试</button>
      <button class="secondary" id="settings">服务器地址 / 本机状态</button>
      <button class="secondary" id="version-check">检查更新</button>
    </div>
    <div class="hint" style="margin-top: 14px">
      提示：本机内核（正在执行的 Agent）不受影响——它会在连接恢复后自动继续领任务；
      关掉窗口也不影响它，托盘常驻。
    </div>
  </div>
  <script>
    const shell = window.synapforgeShell || window.shell;
    (async () => {
      const config = await shell.config();
      document.getElementById("platform").textContent = config.platform_url || "—";
      const snapshot = await shell.snapshot();
      const error = snapshot?.shell?.last_error;
      if (error) document.getElementById("detail").textContent = "内核返回：" + error;
    })();
    document.getElementById("retry").onclick = () => shell.reloadWorkbench();
    document.getElementById("settings").onclick = () => shell.openSetup();
    document.getElementById("version-check").onclick = async () => {
      const result = await shell.checkUpdate();
      document.getElementById("detail").textContent = result?.ok
        ? (result.up_to_date ? "已是最新版本（" + result.current + "）" : "有新版 " + result.latest + "，已打开下载页")
        : "检查更新失败：" + (result?.error || "未知原因");
    };
  </script>
</body>
</html>
