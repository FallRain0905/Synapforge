# Math Agent Platform · nginx 站点配置（由 server_bootstrap.sh 复制到
# /etc/nginx/sites-available/math-agent-platform；路由片段见 /etc/nginx/snippets/math-agent-platform-locations.conf）
#
# 两个入口，职责不同：
#   1) IP 入口（80，default_server）：**不重定向**。已接入的 Agent/桌面端内核用的是 IP 地址，
#      301 会让它们的 POST 与 WebSocket 握手失败；域名入口稳定后再引导迁移。
#   2) 域名入口（synapforge.top）：80 → 301 → 443，443 由 Let's Encrypt 证书终止 TLS，
#      证书由 certbot 自动续期（systemd timer）。域名入口**不套 Basic**：由平台账号体系把关
#      （PLATFORM_AUTH_MODE=required），IP 入口保留 Basic 作为运维后门。
#
# 鉴权模型：平台自身此前没有登录（PLATFORM_AUTH_MODE=development 时无令牌即 member-001），
# 所以入口用 nginx Basic 兜底；账号系统上线后 Basic 变为可选的外层。

# Agent 凭据探测：带了其中任意一种就交给平台判（令牌无效时返回的是平台的 401 JSON）
map $http_authorization $map_bearer_flag {
    default       0;
    "~*^Bearer "  1;
}
map $http_x_project_capability_token $map_capability_flag {
    default  0;
    "~."     1;
}
map $map_agent_credential $map_auth_realm {
    default  "Math Agent Platform";
    "~1"     off;
}
# Basic 只用于 nginx 自身鉴权，不透传给平台（平台会拒绝非 Bearer 的 Authorization 头）
map $http_authorization $map_upstream_auth {
    default       "";
    "~*^Bearer "  $http_authorization;
}

# ---------- 1) IP 入口（保持现状：不重定向） ----------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 512m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    include /etc/nginx/snippets/math-agent-platform-locations.conf;
}

# ---------- 2) 域名入口：80 只做跳转 ----------
server {
    listen 80;
    server_name synapforge.top www.synapforge.top;

    # ACME HTTP-01 挑战要留在 80 明文上（certbot renew 也依赖它）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 3) 域名入口：443 TLS ----------
server {
    # nginx 1.24（Ubuntu 24.04 仓库版）用 listen 参数开 http2；1.25+ 才支持独立指令 `http2 on;`
    listen 443 ssl http2;
    server_name synapforge.top www.synapforge.top;

    ssl_certificate     /etc/letsencrypt/live/synapforge.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapforge.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # HSTS 只作用于域名，不影响 IP 入口的 Agent 连接
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 512m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    include /etc/nginx/snippets/math-agent-platform-locations-public.conf;
}