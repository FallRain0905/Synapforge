# 平台站点的路由片段（**公开入口**：域名 https://synapforge.top 使用）
#
# 与 nginx-locations.conf（IP 入口，带 Basic）的区别：这里不再套 nginx Basic 认证——
# 域名入口由平台自己的账号体系把关（PLATFORM_AUTH_MODE=required，无会话的 API 调用一律 401，
# 工作台由前端引导到 /login）。
#
# 注意：/ws/ 仍然不设任何 nginx 层认证，由协议层令牌（设备令牌 / 协作会话令牌）把关；
# 该路径的 nginx 访问日志关闭，避免令牌（查询参数形式）落进日志。

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 900s;         # 编译/转换/装配等长请求
    proxy_request_buffering off;     # 大文件流式上传
}

location /ws/ {
    access_log off;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

# 桌面端安装包：静态直出，无需登录（公开下载，142MB 级文件不走 Node）
location ^~ /downloads/ {
    alias /opt/math-agent-platform/downloads/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_read_timeout 900s;
}