# 平台站点的路由片段：由 nginx-site.conf 用 include 引入，
# 让"IP 入口（80）"和"域名入口（443 TLS）"共用同一套路由与鉴权规则，避免两份配置各自漂移。
#
# 鉴权分层：
#   - 浏览器走 nginx Basic（或后续接入的账号登录）
#   - Agent 凭据（Authorization: Bearer / X-Project-Capability-Token）跳过 Basic，由平台判令牌
#   - /ws/ 不套 Basic，由协议层令牌鉴权

# 接入流程必需的"无令牌"端点：
#   - /api/devices/register：设备注册，凭据是 15 分钟一次性配对码 + Ed25519 私钥签名
#   - /api/agents/register ：老轨的幂等 Agent 登记（设备注册的前置，不发放任何凭据）
location = /api/devices/register {
    auth_basic off;
    proxy_pass http://127.0.0.1:8000;
}

location = /api/agents/register {
    auth_basic off;
    proxy_pass http://127.0.0.1:8000;
}

location /api/ {
    set $map_agent_credential "$map_bearer_flag$map_capability_flag";
    auth_basic $map_auth_realm;
    auth_basic_user_file /etc/nginx/.math-agent-platform.htpasswd;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Authorization $map_upstream_auth;
    proxy_read_timeout 900s;         # 编译/转换/装配等长请求
    proxy_request_buffering off;     # 大文件流式上传
}

location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location / {
    auth_basic "Math Agent Platform";
    auth_basic_user_file /etc/nginx/.math-agent-platform.htpasswd;
    proxy_pass http://127.0.0.1:3000;
    proxy_read_timeout 900s;
}